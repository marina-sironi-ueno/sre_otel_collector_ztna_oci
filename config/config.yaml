# ZTNA OCI OTel Collector Config
# This config is used to collect metrics from the ZTNA OCI environment.
# By SRE - Observability Team

extensions:
  health_check:
    endpoint: 0.0.0.0:8080
    path: /health

receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: ztna_metrics
          scrape_interval: 30s
          scrape_timeout: 15s
          metrics_path: /metrics
          scheme: http
          static_configs:
            - targets:
                - ${ZTNA_TARGET}:60123
processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 2048
    spike_limit_mib: 512

  batch:
    timeout: 10s
    send_batch_size: 10000

exporters:
  debug:
    verbosity: detailed

  prometheusremotewrite:
    endpoint: https://metric-api.newrelic.com/prometheus/v1/write
    headers:
      api-key: ${NEW_RELIC_LICENSE_KEY}
    external_labels:
      prometheus_server: otel-collector-ztna
    timeout: 60s
    retry_on_failure:
      enabled: true
      initial_interval: 5s
      max_interval: 30s
      max_elapsed_time: 1800s

service:
  extensions: [health_check]
  telemetry:
    logs:
      level: debug
  pipelines:
    metrics:
      receivers: [prometheus]
      processors: [memory_limiter, batch]
      exporters: [debug, prometheusremotewrite]